name: Build The Last Show Android APK

on:
push:
workflow_dispatch:

jobs:
apk:
runs-on: ubuntu-latest
env:
GODOT_VERSION: "4.3"

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Install Godot and export templates
    run: |
      set -e
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
      wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
      sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      sudo chmod +x /usr/local/bin/godot
      mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d tpl
      mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

  - name: Configure Android SDK
    run: |
      set -e
      SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
      if [ -z "$SDK" ] || [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
        echo "Android SDK command-line tools not found on runner."
        exit 1
      fi
      yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      "$SDK/cmdline-tools/latest/bin/sdkmanager" \
        "platform-tools" \
        "build-tools;34.0.0" \
        "platforms;android-34"

  - name: Configure Godot Android export
    run: |
      set -e
      SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
      keytool -genkeypair -v \
        -keystore "$HOME/debug.keystore" \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -keyalg RSA -keysize 2048 -validity 10000 \
        -dname "CN=Android Debug,O=Android,C=US"

      mkdir -p "$HOME/.config/godot"
      cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
      [gd_resource type="EditorSettings" format=3]

      [resource]
      export/android/java_sdk_path = "$JAVA_HOME"
      export/android/android_sdk_path = "$SDK"
      export/android/debug_keystore = "$HOME/debug.keystore"
      export/android/debug_keystore_user = "androiddebugkey"
      export/android/debug_keystore_pass = "android"
      EOF

  - name: Import assets and export APK
    run: |
      set -e
      mkdir -p build
      godot --headless --path . --import
      godot --headless --path . --export-debug "Android" build/LastShow.apk
      test -f build/LastShow.apk
      ls -lh build/LastShow.apk

  - uses: actions/upload-artifact@v4
    with:
      name: The-Last-Show-APK
      path: build/LastShow.apk
      if-no-files-found: error
      retention-days: 14
